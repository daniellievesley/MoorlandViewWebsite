name: Update News From Notion

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: moorland-news/package-lock.json

      - name: Install Astro dependencies
        working-directory: moorland-news
        run: npm ci

      - name: Build news pages from Notion
        working-directory: moorland-news
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: npm run build

      - name: Sync generated news pages into site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p news
          rsync -a --delete moorland-news/dist/news/ news/

          if [ -f moorland-news/dist/news.html ]; then
            cp moorland-news/dist/news.html news.html
          elif [ -f moorland-news/dist/news/index.html ]; then
            cp moorland-news/dist/news/index.html news.html
          fi

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news news.html
          if git diff --cached --quiet; then
            echo "No news changes to commit."
            exit 0
          fi
          git commit -m "Update news from Notion"
          git push
