name: Update News From Notion

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: moorland-news
        run: npm install

      - name: Build news site
        working-directory: moorland-news
        run: npm run build
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - name: Sync built news files
        run: |
          set -euo pipefail

          mkdir -p news

          rsync -a --delete moorland-news/dist/news/ news/

          if [ -f moorland-news/dist/news.html ]; then
            cp moorland-news/dist/news.html news.html
          fi

      - name: Commit updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news news.html

          git diff --cached --quiet || git commit -m "Update news from Notion"

          git push