name: Update News From Notion

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: moorland-news/package-lock.json

      - name: Install dependencies
  run: npm install
  working-directory: moorland-news

- name: Build Astro site
  run: npm run build
  working-directory: moorland-news

- name: Copy news output
  run: |
    mkdir -p news
    rsync -a --delete moorland-news/dist/news/ news/

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news news.html
          if git diff --cached --quiet; then
            echo "No news changes to commit."
            exit 0
          fi
          git commit -m "Update news from Notion"
          git push
